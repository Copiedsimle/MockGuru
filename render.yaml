services:
  - type: web
    name: mockexam
    runtime: python3
    buildCommand: |
      pip install -r requirements.txt
      python3 manage.py collectstatic --noinput
      python3 manage.py migrate
    startCommand: gunicorn mockexam.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        fromService:
          type: web
          name: mockexam
          property: host
    databases:
      - name: mockexam-db
        databaseName: mockexam
        user: mockexam